<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fronts: a small WW2 strategy game</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d2421;--panel:#27302c;--ink:#e8e2cf;--dim:#9aa196;--acc:#d9a441;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;display:flex;overflow:hidden}
h1,h2,button,.t{font-family:'Special Elite','Courier New',monospace;font-weight:400;margin:0}
h2{font-size:17px}
button{background:#3a463f;color:var(--ink);border:1px solid #55635a;padding:6px 11px;font-size:14px;cursor:pointer;border-radius:3px}
button:hover,button:focus-visible{border-color:var(--acc);outline:none}
button.on{background:var(--acc);color:#1d2421;border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dim{color:var(--dim);font-size:13px}
#rail{width:56px;flex:none;background:#141a17;display:flex;flex-direction:column;gap:8px;padding:10px 7px;z-index:4;border-right:1px solid #33403a}
#rail button{width:42px;height:42px;padding:0;font-size:20px;line-height:1}
#drawer{position:absolute;left:56px;top:0;bottom:0;width:min(340px,calc(100vw - 56px));background:var(--panel);padding:14px;overflow:auto;z-index:3;border-right:1px solid #55635a;display:none}
#drawer p{margin:8px 0}
.rw{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:3px;cursor:pointer;font-size:14px}
.rw:hover{background:#34403a}
.rw i{width:12px;height:12px;border-radius:2px;flex:none;border:1px solid #0006}
details{margin:6px 0}summary{cursor:pointer;font-family:'Special Elite','Courier New',monospace}
main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
#top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid #33403a}
#top b{color:var(--acc);font-weight:400}
.tick{flex:1 1 200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#263438;position:relative;overflow:hidden;touch-action:none}
#zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
#zoom button{width:36px;height:36px;padding:0;font-size:18px}
.tr{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
canvas{max-width:100%;max-height:100%;cursor:pointer;transform-origin:0 0}
.tn{margin:6px 0;border-left:2px solid #55635a;padding-left:8px}.tn.done{border-color:#d9a441}.tn.lock{opacity:.7}
#drawer.wide{width:min(480px,calc(100vw - 56px))}
#card{position:absolute;right:10px;bottom:10px;width:min(310px,calc(100% - 20px));background:var(--panel);border:1px solid #55635a;border-radius:4px;padding:12px;display:none}
#evt{position:fixed;inset:0;background:rgba(10,14,12,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:8;overflow:auto}
.evc{width:min(560px,100%);background:var(--panel);border:1px solid #6a7a70;border-radius:6px;overflow:hidden;box-shadow:0 12px 40px #000a;padding-bottom:12px}
.evb{height:110px;display:flex;align-items:center;justify-content:center;font-size:54px;background:linear-gradient(135deg,#3f5046,#1b2420)}
.evc h1{font-size:24px;padding:14px 18px 0}
.evc p{padding:0 18px;margin:8px 0 12px;color:#cfc9b5}
.evo{display:block;width:calc(100% - 36px);margin:8px 18px 0;text-align:left;padding:10px 12px}
.evo b{display:block;font-family:'Special Elite','Courier New',monospace;font-weight:400;font-size:15px}
.evo span{display:block;font-size:13px;color:var(--dim);margin-top:2px}
#ov{position:fixed;inset:0;background:rgba(17,22,19,.93);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
#ov>div{max-width:520px}
#ov h1{font-size:30px;margin-bottom:8px}
#ov p{color:var(--dim)}
#ov .row button{flex:1 1 140px;padding:12px}

function calcSupply(){sup={};const q=[];Object.keys(CAP).forEach(t=>{const c=CAP[t];if(T[t].f!=='nu'&&reg[c].tag===t){sup[c]=0;q.push(c)}});
 while(q.length){const i=q.shift();nb[i].forEach(j=>{if(sup[j]===undefined&&T[reg[j].tag].f!=='nu'&&same(reg[i].tag,reg[j].tag)){sup[j]=sup[i]+1;q.push(j)}})}}
const same=(x,y)=>x===y||(T[x].f===T[y].f&&T[x].f!=='nu');
const wk=(x,y)=>x<y?x+'|'+y:y+'|'+x;
function hostile(x,y){if(x===y)return false;const a=T[x].f,b=T[y].f;if(a===b)return false;if(pacts.has([a,b].sort().join()))return false;return wars.has(wk(x,y))}
const members=f=>Object.keys(T).filter(t=>T[t].f===f);
function warF(fa,fb){members(fa).forEach(p=>members(fb).forEach(q=>wars.add(wk(p,q))))}
const atWarF=(fa,fb)=>members(fa).some(p=>members(fb).some(q=>wars.has(wk(p,q))));
function declareWar(x,y){if(x===y||same(x,y)||hostile(x,y)||pacts.has([T[x].f,T[y].f].sort().join()))return;
 const A=T[x].f==='nu'?[x]:members(T[x].f),B=T[y].f==='nu'?[y]:members(T[y].f);
 A.forEach(p=>B.forEach(q=>{if(!pacts.has([T[p].f,T[q].f].sort().join()))wars.add(wk(p,q))}));
 B.forEach(q=>{if(q!==me&&owned(q).length){if(T[q].f==='nu')owned(q).forEach(i=>reg[i].t+=2);else addM(q,15)}});
 const m=`${T[x].n} declares war on ${T[y].n}.`+(B.length>1?` ${B.filter(q=>q!==y).map(q=>T[q].n).join(', ')} join${B.length>2?'':'s'} them.`:'');
 log(m);if(A.includes(me)||B.includes(me))wl(m)}
const front=i=>nb[i].filter(j=>hostile(reg[i].tag,reg[j].tag)).length;
const log=m=>{logs.unshift(m);logs.length=Math.min(logs.length,40)};
const owned=t=>ids.filter(i=>reg[i].tag===t);
const sum=(t,k)=>owned(t).reduce((s,i)=>s+reg[i][k],0);
const aggr=()=>day>=D_POLAND||wars.size>0;

function start(t){me=t;day=0;sel=null;over=false;logs=[];wars=new Set();reg={};wlogs=[];wstat={won:0,lost:0};aid=0;men={};tk={};prog={};ar={};tech={};rp={};line={};battles=[];flags={};pacts=new Set();evQ=[];evOpen=null;lastRand=0;fireAt={};T.SOV.f='su';EV.forEach(e=>{if(e.day)fireAt[e.id]=e.day[0]+Math.floor(Math.random()*(e.day[1]-e.day[0]+1))});EV.forEach(e=>{if(e.after)fireAt[e.id]=fireAt[e.after]+2});
 R0.forEach(([id,name,tag,fa,ba,tr])=>reg[id]={id,name,tag,fa,ba,t:tr,k:Math.floor(fa/3),a:Math.floor(fa/4)});
 Object.keys(T).forEach(k=>{men[k]=sum(k,'ba')*3;tk[k]=0;prog[k]=0;ar[k]=0;tech[k]=new Set();rp[k]=0;line[k]=Math.random()<.7?'k':'a'});line[me]='k';
 log('January 1, 1936. Europe is at peace. Build up your forces.');
 $('ov').style.display='none';setSpeed(1);render()}

let wlogs=[],wstat={won:0,lost:0},aid=0;
const wl=m=>{wlogs.unshift(dateStr()+': '+m);wlogs.length=Math.min(wlogs.length,200)};
const cpos=id=>{const i=ids.indexOf(id);return cen[i]||[X(R0[i][6]),Y(R0[i][7])]};
const march=(f,t)=>{const a=cpos(f),b=cpos(t);return Math.max(2,Math.round(Math.hypot(a[0]-b[0],a[1]-b[1])/60))+(SEA.includes(f+'-'+t)||SEA.includes(t+'-'+f)?3:0)};
const inv=bt=>bt.tag===me||reg[bt.to].tag===me;
const note=(bt,m)=>{log(m);if(inv(bt))wl(m)};
function back(bt){const h=reg[bt.from];if(same(h.tag,bt.tag)){h.t+=bt.t;h.k+=bt.k;h.a+=bt.a}}
function attack(f,t,fr=1){const a=reg[f],b=reg[t],n=Math.floor((a.t-1)*fr),k=Math.floor(a.k*fr),g=Math.floor(a.a*fr);
 if(same(a.tag,b.tag)){if(n+k+g<1)return;a.t-=n;a.k-=k;a.a-=g;battles.push({id:++aid,kind:'mv',st:'move',wait:march(f,t),from:f,to:t,tag:a.tag,t:n,k,a:g,t0:n,d0:0,day:0,E:.5});return}
 if(!hostile(a.tag,b.tag)){if(a.tag===me)log(`You are not at war with ${T[b.tag].n}. Declare war in the Diplomacy panel first.`);return}
 if(n<1)return;
 a.t-=n;a.k-=k;a.a-=g;const mob=2+Math.min(6,Math.floor((n+3*k+2*g)/20));
 battles.push({id:++aid,kind:'atk',st:'mob',wait:mob,from:f,to:t,tag:a.tag,t:n,k,a:g,t0:n,d0:b.t,day:0,E:.5});
 if(a.tag===me)wl(`Orders given: ${n} men, ${k} tanks and ${g} guns mobilise to attack ${b.name}. Ready in ${mob} days.`);
 else if(b.tag===me)wl(`Warning: ${T[a.tag].n} is mobilising forces against ${b.name}.`)}
// each day: armies mobilise, then march, then fight one round; the side with more of each weapon loses less
function stepBattles(){const keep=[];
 for(const bt of battles){const b=reg[bt.to],ter=TER[bt.to];
  if(bt.st!=='fight'){
   if(--bt.wait>0){keep.push(bt);continue}
   if(bt.st==='mob'){bt.st='move';bt.wait=march(bt.from,bt.to);if(bt.tag===me)wl(`The army marches on ${b.name}. Arrival in ${bt.wait} days.`);keep.push(bt);continue}
   if(same(bt.tag,b.tag)){b.t+=bt.t;b.k+=bt.k;b.a+=bt.a;continue}
   if(bt.kind==='mv'||!hostile(bt.tag,b.tag)){back(bt);continue}
   const ex=[...keep,...battles].find(x=>x!==bt&&x.st==='fight'&&x.to===bt.to&&same(x.tag,bt.tag));
   if(ex){ex.t+=bt.t;ex.k+=bt.k;ex.a+=bt.a;ex.t0+=bt.t;if(inv(bt))wl(`Reinforcements reach the battle for ${b.name}.`);continue}
   bt.st='fight';bt.d0=b.t;bt.day=0;if(inv(bt))wl(`Battle for ${b.name} begins: ${T[bt.tag].n} attacks with ${bt.t} men, ${bt.k} tanks and ${bt.a} guns.`);keep.push(bt);continue}
  if(!hostile(bt.tag,b.tag)){const d=same(bt.tag,b.tag)?b:reg[bt.from];if(same(d.tag,bt.tag)){d.t+=bt.t;d.k+=bt.k;d.a+=bt.a}continue}
  const A=eff(bt,bt.tag,ter,1,oos(bt.from)),D=eff(b,b.tag,ter,0,oos(bt.to)),E=edge(A,D),Ed=Math.min(.97,Math.max(.03,E+(Math.random()-.5)*.12)),ra=.16*(1-Ed),rd=.16*Ed;
  bt.t-=lose(bt.t,ra);bt.k-=lose(bt.k,ra);bt.a-=lose(bt.a,ra*.6);
  b.t-=lose(b.t,rd);b.k-=lose(b.k,rd);b.a-=lose(b.a,rd*.6);bt.day++;bt.E=E;
  if(bt.day%7===0&&inv(bt))wl(`Battle for ${b.name}, day ${bt.day}: attacker edge ${Math.round(E*100)}%. Attackers ${bt.t} men ${bt.k}T ${bt.a}A, defenders ${b.t} men ${b.k}T ${b.a}A.`);
  const aB=bt.t<=0||bt.t<.3*bt.t0,dB=b.t<=0||b.t<.25*bt.d0;
  if((b.t<=0&&bt.t>0)||(!aB&&dB)){const old=b.tag;b.tag=bt.tag;b.t=Math.max(1,bt.t);b.k=bt.k;b.a=bt.a;
   if(bt.tag===me)wstat.won++;if(old===me)wstat.lost++;
   note(bt,CAP[old]===bt.to?`${b.name}, capital of ${T[old].n}, has fallen to ${T[bt.tag].n} after ${bt.day} days!`:`${T[bt.tag].n} took ${b.name} after ${bt.day} days.`);check();continue}
  if(aB){back(bt);note(bt,`${T[bt.tag].n} failed to take ${b.name} after ${bt.day} days.`);continue}
  keep.push(bt)}
 battles=keep}

function check(){if(reg[CAP[me]].tag!==me)return end(false);
 if(ids.filter(i=>same(me,reg[i].tag)).length>=GOAL)end(true)}
function end(win){over=true;setSpeed(0);const o=$('ov');o.style.display='flex';
 o.innerHTML=`<div><h1>${win?'Victory':'Defeat'}</h1><p>${win?`Your side holds ${GOAL} of ${ids.length} regions on ${dateStr()}.`:`Your capital fell on ${dateStr()}.`}</p><button onclick="menu()">Play again</button></div>`}

function build(t,r,type){const c=type==='fa'?CF:CB;if(men[t]>=c&&r[type]<MAXB){men[t]-=c;r[type]++;return true}}
function deploy(t,r,m,k,g=0){r.t+=m;men[t]-=m;r.k+=k;tk[t]-=k;r.a+=g;ar[t]-=g}

function ai(t){const mine=owned(t);if(!mine.length)return;
 if(men[t]>=25&&Math.random()<.3){const r=pick(mine);if(!build(t,r,Math.random()<.5?'fa':'ba'))build(t,r,'ba')}
 const fr=mine.filter(i=>front(i)>0),tg=fr.length?fr:[pick(mine)],q=tg.length,m=Math.max(0,Math.floor(men[t])-8),k=Math.floor(tk[t]),g=Math.floor(ar[t]);
 tg.forEach(id=>deploy(t,reg[id],Math.floor(m/q),Math.floor(k/q),Math.floor(g/q)));
 if(!aggr()||(t==='USA'&&day<D_USA))return;
 if(Math.random()<.006){const c=new Set();mine.forEach(i=>nb[i].forEach(j=>{const o=reg[j].tag;if(T[o].f==='nu'&&mine.some(m=>nb[m].includes(j)&&edgeOf(m,j,1)>=.7))c.add(o)}));if(c.size)declareWar(t,rnd([...c]))}
 for(const i of [...mine].sort(()=>Math.random()-.5)){const a=reg[i];if(a.tag!==t||a.t<4||Math.random()>.15)continue;
  const hs=nb[i].filter(j=>hostile(t,reg[j].tag)).sort((x,y)=>tot(reg[x])-tot(reg[y]));
  if(hs.length){const w=hs.find(j=>edgeOf(i,j,1)>=.62);if(w)attack(i,w)}
  else{const fs=nb[i].filter(j=>same(t,reg[j].tag));const f2=fs.filter(j=>front(j)>0);const c=f2.length?f2[0]:pick(fs);if(c)attack(i,c)}
  if(over)return}}

function fire(ev){if(ev.when&&!ev.when())return;flags['done_'+ev.id]=day;const who=ev.who==='me'?[me]:ev.who;
 who.forEach(t=>{if(t===me||!owned(t).length)return;const o=ev.opts.filter(x=>!x.for||x.for.includes(t));(o[ev.ai||0]||o[0]).f(t)});
 if(who.includes(me)){evQ.push(ev);showEv()}}
function showEv(){if(evOpen||!evQ.length)return;const ev=evQ.shift();evOpen=ev;evPrev=spd||last;setSpeed(0);
 const o=ev.opts.filter(x=>!x.for||x.for.includes(me)),e=$('evt');e.style.display='flex';
 e.innerHTML=`<div class="evc"><div class="evb">${ev.icon}</div><h1>${ev.title}</h1><p>${ev.text(me)}</p>${o.map((x,i)=>`<button class="evo" onmousedown="pickEv(${i})"><b>${x.l}</b><span>${x.d}</span></button>`).join('')}</div>`}
function pickEv(i){const ev=evOpen,o=ev.opts.filter(x=>!x.for||x.for.includes(me));o[i].f(me);evOpen=null;$('evt').style.display='none';if(over)return;setSpeed(evPrev);render();showEv()}
function evTick(){EV.forEach(e=>{if(fireAt[e.id]===day)fire(e)});
 if(!evOpen&&day-lastRand>=120&&Math.random()<.02){const c=EV.filter(e=>e.rand&&(flags['done_'+e.id]===undefined||day-flags['done_'+e.id]>700)&&(!e.when||e.when()));if(c.length){lastRand=day;fire(pick(c))}}}
function tick(){if(over)return;day++;calcSupply();evTick();
 Object.keys(T).forEach(t=>{if(T[t].f==='nu')return;
  men[t]+=sum(t,'ba')*BARR*(1+bn(t,'man'));prog[t]+=sum(t,'fa')*FACT*(1+bn(t,'fac'));rp[t]+=(sum(t,'fa')+sum(t,'ba'))*.05*(1+bn(t,'rs'));
  const c=line[t]==='k'?1:.6;
  while(prog[t]>=c&&men[t]>=1){prog[t]-=c;men[t]--;line[t]==='k'?tk[t]++:ar[t]++}
  prog[t]=Math.min(prog[t],1.5);
  if(t!==me){const nx=TECH.filter(x=>can(t,x)&&rp[t]>=x[3]).sort((p,q)=>p[3]-q[3])[0];if(nx){rp[t]-=nx[3];tech[t].add(nx[0])}}});
 if(day===D_POLAND&&me!=='GER'&&!atWarF('al','ax'))declareWar('GER','POL');
 if(day===D_POLAND+17&&pacts.has('ax,su')&&reg.GAL.tag==='POL'){reg.GAL.tag='SOV';reg.GAL.t=Math.max(reg.GAL.t,4);log('The Soviet Union occupies eastern Poland.');check()}
 if(day===D_USA)log('The United States enters the war.');
 stepBattles();
 Object.keys(T).forEach(t=>{if(T[t].f!=='nu'&&t!==me)ai(t)});
 render()}
function setSpeed(s){spd=s;if(s)last=s;clearInterval(timer);if(s)timer=setInterval(tick,[0,700,350,200,100,40][s]);renderSpeed()}

const dateStr=()=>new Date(Date.UTC(1936,0,1+day)).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
const running=()=>reg&&!over&&!evOpen&&$('ov').style.display==='none';
addEventListener('keydown',e=>{if(!running())return;
 if(e.key==='Escape'){sel=null;render()}
 else if(e.code==='Space'){e.preventDefault();setSpeed(spd?0:last)}
 else if(/^[1-5]$/.test(e.key))setSpeed(+e.key)});
addEventListener('keyup',e=>{if(e.code==='Space'&&running())e.preventDefault()});

function click(id,e){if(over)return;
 if(sel&&sel!==id&&!(e&&e.shiftKey)&&reg[sel].tag===me&&nb[sel].includes(id)){attack(sel,id,frac);if(reg[sel].tag!==me||reg[sel].t<2)sel=reg[id].tag===me?id:sel}
 else sel=id;render()}
function act(kind){const r=reg[sel];if(!r||r.tag!==me)return;
