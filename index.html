<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fronts: a small WW2 strategy game</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d2421;--panel:#27302c;--ink:#e8e2cf;--dim:#9aa196;--acc:#d9a441;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;display:flex;overflow:hidden}
h1,h2,button,.t{font-family:'Special Elite','Courier New',monospace;font-weight:400;margin:0}
h2{font-size:17px}
button{background:#3a463f;color:var(--ink);border:1px solid #55635a;padding:6px 11px;font-size:14px;cursor:pointer;border-radius:3px}
button:hover,button:focus-visible{border-color:var(--acc);outline:none}
button.on{background:var(--acc);color:#1d2421;border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dim{color:var(--dim);font-size:13px}
#rail{width:72px;flex:none;background:#141a17;display:flex;flex-direction:column;align-items:center;gap:8px;padding:78px 7px 10px;z-index:4;border-right:1px solid #33403a}
#rail button{width:42px;height:42px;padding:0;font-size:20px;line-height:1}
#drawer{position:absolute;left:72px;top:0;bottom:0;width:min(340px,calc(100vw - 72px));background:var(--panel);padding:14px;overflow:auto;z-index:3;border-right:1px solid #55635a;display:none}
#drawer p{margin:8px 0}
.rw{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:3px;cursor:pointer;font-size:14px}
.rw:hover{background:#34403a}
.rw i{width:12px;height:12px;border-radius:2px;flex:none;border:1px solid #0006}
details{margin:6px 0}summary{cursor:pointer;font-family:'Special Elite','Courier New',monospace}
main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
#top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid #33403a}
#top b{color:var(--acc);font-weight:400}
.chips{display:flex;gap:4px 16px;flex-wrap:wrap;align-items:center;font-size:16px}
.chip{cursor:help;white-space:nowrap}
.tick{flex:1 1 200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#263438;position:relative;overflow:hidden;touch-action:none}
#zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
#zoom button{width:36px;height:36px;padding:0;font-size:18px}
.tr{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;display:block}
.evo.pick{border-color:var(--acc);background:#46513f}
.tn{margin:6px 0;border-left:2px solid #55635a;padding-left:8px}.tn.done{border-color:#d9a441}.tn.lock{opacity:.7}
#drawer.wide{width:min(480px,calc(100vw - 72px))}
#flag{position:fixed;left:0;top:0;width:72px;height:70px;z-index:5;background:#141a17;border-right:1px solid #33403a;border-bottom:1px solid #33403a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:default}
#flag svg,#flag img{width:56px;height:37px;display:block;border:1px solid #000;box-shadow:0 0 0 2px #55635a,0 3px 8px #0009;object-fit:fill}
#sendbar{position:fixed;top:78px;left:calc(50% + 36px);transform:translateX(-50%);z-index:6;background:#46513f;border:2px solid var(--acc);border-radius:6px;padding:8px 10px 8px 16px;display:none;align-items:center;gap:12px;box-shadow:0 6px 18px #000a;max-width:calc(100vw - 100px);font-size:15px}
#chiptip{position:fixed;z-index:8;display:none;background:var(--panel);border:1px solid var(--acc);border-radius:6px;padding:8px 12px;max-width:min(320px,calc(100vw - 16px));font-size:14px;box-shadow:0 6px 18px #000a}
#sendbar b{color:var(--acc);font-weight:600}
#sendbar button{padding:6px 12px;flex:none}
.dclose{display:none}
#flag b{font-size:10px;letter-spacing:.5px;color:var(--dim);font-weight:600}
#card{position:absolute;right:10px;bottom:10px;width:min(310px,calc(100% - 20px));background:var(--panel);border:1px solid #55635a;border-radius:4px;padding:12px;display:none}
#evt{position:fixed;inset:0;background:rgba(10,14,12,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:8;overflow:auto}
.evc{max-height:92vh;overflow-y:auto;overscroll-behavior:contain;width:min(560px,100%);background:var(--panel);border:1px solid #6a7a70;border-radius:6px;box-shadow:0 12px 40px #000a;padding-bottom:0}
.evc>.evo:last-child{margin-bottom:12px}
.evf{position:sticky;bottom:0;background:var(--panel);border-top:1px solid #55635a;padding:4px 0 12px;margin-top:8px}
.evb{height:110px;display:flex;align-items:center;justify-content:center;font-size:54px;background:linear-gradient(135deg,#3f5046,#1b2420)}
.evc h1{font-size:24px;padding:14px 18px 0}
.evc p{padding:0 18px;margin:8px 0 12px;color:#cfc9b5}
.evo{display:block;width:calc(100% - 36px);margin:8px 18px 0;text-align:left;padding:10px 12px}
.evo b{display:block;font-family:'Special Elite','Courier New',monospace;font-weight:400;font-size:15px}
.evo span{display:block;font-size:13px;color:var(--dim);margin-top:2px}
input[type=range]{flex:1;min-width:90px;accent-color:#d9a441}
#banner{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:7;background:#6b2620;border:2px solid #e8806e;border-radius:6px;padding:10px 18px;font-family:'Special Elite','Courier New',monospace;font-size:16px;box-shadow:0 8px 24px #000a;display:none;cursor:pointer;max-width:calc(100% - 24px);text-align:center}
#pickbar{position:fixed;top:0;left:0;right:0;z-index:6;background:var(--panel);border-bottom:2px solid var(--acc);padding:10px 14px;display:none;gap:12px;align-items:center;flex-wrap:wrap}
#pickbar span{flex:1 1 320px}
body.picking #rail,body.picking #top,body.picking #flag{visibility:hidden}
#tut{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(600px,calc(100% - 24px));background:var(--panel);border:1px solid var(--acc);border-radius:6px;padding:14px 16px;z-index:7;box-shadow:0 10px 30px #000a;display:none}
.hl{outline:3px solid var(--acc);outline-offset:2px;animation:pulse 1.3s infinite}
@keyframes pulse{50%{outline-color:#fff}}
#ov{position:fixed;inset:0;background:rgba(17,22,19,.93);display:flex;justify-content:center;padding:20px;z-index:9;overflow-y:auto}
#ov>div{max-width:520px;margin:auto}
#ov p{color:var(--dim)}
#ov .row button{flex:1 1 140px;padding:12px}

html,body{height:100dvh}
button{touch-action:manipulation}
@media (max-width:760px),(max-height:520px) and (pointer:coarse){
 body{font-size:14px}
 main{padding-bottom:56px}
 #rail{position:fixed;left:0;right:0;bottom:0;width:auto;height:56px;flex-direction:row;justify-content:space-around;align-items:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:2px;border-right:0;border-top:1px solid #33403a;z-index:7;box-sizing:content-box}
 #rail button{width:40px;height:40px;font-size:19px}
 #flag{width:54px;height:52px;z-index:5;border-bottom:1px solid #33403a;gap:1px}
 #flag svg,#flag img{width:40px;height:27px;box-shadow:0 0 0 1px #55635a}
 #flag b{font-size:9px}
 #top{padding:4px 8px 4px 60px;gap:2px 10px;min-height:52px}
 .chips{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;gap:2px 12px;font-size:14px;scrollbar-width:none}
 .chips::-webkit-scrollbar{display:none}
 .tick{display:none}
 .tr{flex:1 1 100%;margin-left:0;justify-content:space-between;gap:6px;flex-wrap:nowrap}
 .tr h2{font-size:12px;white-space:nowrap}
 .tr .dim{display:none}
 .tr>.row{gap:3px;flex-wrap:nowrap}
 .tr button{padding:2px 6px;font-size:12px;min-width:26px;min-height:30px}
 body.sending #card{display:none!important}
 #drawer,#drawer.wide{position:fixed;left:0;right:0;top:0;bottom:calc(56px + env(safe-area-inset-bottom));width:auto;z-index:6;border-right:0;padding:10px 12px 20px;-webkit-overflow-scrolling:touch}
 .dclose{display:block;position:sticky;top:-10px;margin:-10px -12px 8px auto;float:right;z-index:2;background:#46513f}
 #card{left:8px;right:8px;width:auto;bottom:8px;max-height:46vh;overflow:auto;padding:10px}
 #zoom{right:6px;top:6px}
 #zoom button{width:34px;height:34px}
 #sendbar{top:76px;left:50%;transform:translateX(-50%);width:calc(100vw - 16px);max-width:none;font-size:14px;padding:6px 8px 6px 12px}
 #banner{top:64px;max-width:calc(100vw - 16px);font-size:14px;padding:8px 12px}
 #tut{bottom:calc(64px + env(safe-area-inset-bottom));width:calc(100% - 16px);padding:10px 12px;max-height:50vh;overflow:auto}
 .evc{max-height:92dvh}
 #ov>div{max-width:100%}
 #pickbar{padding:8px 10px}
 button{min-height:34px}
}
@media (max-height:520px) and (pointer:coarse) and (min-width:761px){
 #top{flex-wrap:nowrap;min-height:44px}
 .chips{flex:1 1 auto}.tr{flex:0 0 auto}
 #card{left:auto;right:8px;width:min(300px,50vw);max-height:60vh}
 #sendbar{top:50px;width:auto;max-width:70vw}
 #tut{bottom:64px;width:min(560px,80vw)}
}

#ov{background:radial-gradient(ellipse at 22% 8%,rgba(34,44,38,.80),rgba(9,13,11,.965) 70%);backdrop-filter:blur(2px) saturate(.6);-webkit-backdrop-filter:blur(2px) saturate(.6)}
#ov>.mn{max-width:1040px;width:100%;margin:auto;position:relative;z-index:1;padding:10px 4px 24px}
.mn-bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.mn-grat path{fill:none;stroke:#e8e2cf;stroke-opacity:.055;stroke-width:1}
.mn-ar{fill:none;stroke:#b8382f;stroke-opacity:.34;stroke-width:16;stroke-linecap:butt;stroke-dasharray:1;stroke-dashoffset:1;animation:mndraw 1.5s cubic-bezier(.3,.6,.3,1) forwards}
.mn-ah{fill:#b8382f;fill-opacity:.34;opacity:0;animation:mnfade .3s ease forwards}
.mn-front{fill:none;stroke:#d9a441;stroke-opacity:.3;stroke-width:3;stroke-dasharray:2 11;stroke-linecap:round}
@keyframes mndraw{to{stroke-dashoffset:0}}@keyframes mnfade{to{opacity:1}}
#ov h1{font-size:clamp(64px,14vw,132px);line-height:.95;letter-spacing:-.03em;margin:0;color:var(--ink);text-shadow:0 3px 0 #0006}
.mn-head{margin:4vh 0 4vh}
#ov .mn-date{font-family:Georgia,'Times New Roman',serif;font-size:clamp(16px,2.4vw,20px);line-height:1.5;color:var(--ink);margin:14px 0 0;max-width:34em;opacity:.9}
.mn-h{font-size:20px;margin:0 0 14px;color:var(--acc)}
.mn-flags{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:18px 16px}
.fc{display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:4px;padding:10px 10px 12px;background:#1f2723;border:1px solid #46544c;border-radius:2px;position:relative;box-shadow:0 8px 18px #0007;transform:rotate(var(--r,0deg));transition:transform .18s ease,border-color .18s,box-shadow .18s;font-family:system-ui,sans-serif}
.fc:nth-child(odd){--r:-.7deg}.fc:nth-child(even){--r:.6deg}.fc:nth-child(3n){--r:-.3deg}
.fc::before{content:"";position:absolute;top:-6px;left:50%;width:11px;height:11px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e6786a,#8c261d 70%);box-shadow:0 2px 3px #000a}
.fc:hover,.fc:focus-visible{--r:0deg;transform:translateY(-5px);border-color:var(--acc);box-shadow:0 14px 26px #000a;background:#27302b}
.fc .fl{display:block;aspect-ratio:3/2;border:3px solid #ece6d4;background:#ece6d4;box-shadow:0 1px 3px #0008;overflow:hidden}
.fc .fl svg,.fc .fl img{width:100%;height:100%;display:block;object-fit:fill}
.fc b{font-family:'Special Elite','Courier New',monospace;font-weight:400;font-size:18px;margin-top:8px;color:var(--ink)}
.fc i{font-style:normal;font-size:13px;line-height:1.35;color:var(--dim)}
.mn-act{margin-top:24px;gap:10px}
.mn-act button{flex:0 1 auto;padding:11px 16px;font-size:15px}
.mn-act .mn-any{background:var(--acc);color:#1d2421;border-color:var(--acc)}
.mn-act .mn-any:hover{background:#e8b85a}
.mn-how{margin-top:26px;border-top:1px solid #3a463f;padding-top:12px;max-width:44em}
.mn-how summary{font-size:16px;color:var(--ink)}
.mn-how p{font-family:Georgia,'Times New Roman',serif;font-size:15px;line-height:1.6;margin:10px 0;color:var(--ink);opacity:.88}
.mn-how b{font-family:'Special Elite','Courier New',monospace;font-weight:400;color:var(--acc)}
.mn-foot{display:flex;justify-content:space-between;gap:12px;margin:22px 0 0;font-size:13px;color:var(--dim)}
@media (min-width:900px){.mn-flags{grid-template-columns:repeat(3,1fr);gap:22px 20px}.fc{display:grid;grid-template-columns:150px 1fr;grid-template-rows:auto 1fr;column-gap:14px;row-gap:2px;align-items:start;padding:12px}.fc .fl{grid-row:1/3}.fc b{margin-top:2px;align-self:end}.fc i{align-self:start;font-size:13.5px}}
@media (max-width:760px){.mn-flags{grid-template-columns:repeat(2,1fr);gap:16px 12px}.fc b{font-size:16px}.fc i{font-size:12px}.mn-head{margin:2vh 0 3vh}.mn-act button{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){.mn-ar{animation:none;stroke-dashoffset:0}.mn-ah{animation:none;opacity:1}.fc{transition:none}}

.gcard{background:#2f3a34;margin:10px 0;padding:10px;border-left:5px solid var(--gc,#888);border-radius:3px}
.gcard h3{margin:0 0 2px;font-size:16px;font-family:'Special Elite','Courier New',monospace;font-weight:400}
.gt{font-size:13px;margin:2px 0}.gt.good b{color:#8fd19e;font-weight:600}.gt.bad b{color:#e8806e;font-weight:600}
.gs{font-size:13px;color:var(--acc);margin-top:4px}
.gcard .row{margin-top:8px}.gcard button{padding:5px 9px;font-size:13px}
.gchip{display:inline-flex;gap:2px;align-items:center;background:#1d2421;border:1px solid #55635a;border-radius:12px;padding:1px 2px 1px 9px;margin:2px 3px 2px 0;font-size:13px}
.gchip button{padding:0 7px!important;min-height:0!important;font-size:15px!important;border:0;background:none}
@media (max-width:760px),(max-height:520px) and (pointer:coarse){#rail button{width:auto;flex:1 1 0;max-width:42px;min-width:26px;padding:0}}
</style></head><body>
<div id="flag" title=""></div><nav id="rail"></nav>
<section id="drawer"></section>
<main><div id="top"><div class="chips" id="chips"></div><div class="dim tick" id="tick"></div><div class="tr" id="tr"></div></div><div id="mapwrap"><canvas id="cv" width="300" height="200" aria-label="World map"></canvas><div id="zoom"><button onmousedown="zoomBy(1.4)" aria-label="Zoom in">+</button><button onmousedown="zoomBy(1/1.4)" aria-label="Zoom out">−</button></div></div><div id="card"></div></main>
<div id="pickbar"></div>
<div id="sendbar"></div>
<div id="chiptip" onclick="this.style.display='none'"></div>
<div id="banner" onmousedown="this.style.display='none'"></div>
<div id="tut"></div>
<div id="ov"></div>
<div id="evt"></div>
